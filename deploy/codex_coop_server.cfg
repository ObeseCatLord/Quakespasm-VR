// Shared co-op server defaults used by Codex deploy scripts.
deathmatch 0
coop 1
sv_cheats 1
// Preserve intended co-op combat: players cannot hurt other players.
// Self-damage (for example rocket-jumping) remains enabled by the server code.
sv_nofriendlyfire 1

// A 40 Hz simulation keeps .025-second modern-mod weapon thinks (including
// Alkaline's nailgun) at their authored rate while retaining the same
// latest-command networking model.
host_framerate 0
host_timescale 0
sys_ticrate 0.025
sv_netsort 1
sv_maxpacketsize 1400
// 0 keeps QSS-M-style uncapped replacement-delta catch-up for every server frame.
sv_replacement_maxpackets 0
sv_pmove_mode 1
sv_nqplayerphysics 0
sv_trustedmovement 1
sv_predict_nqmovement 0
sv_inputtimeout 0
sv_gameplayfix_spawnbeforethinks 0
net_lagdebug 0
net_lagdebug_threshold 0.25
net_lagdebug_frame_threshold 0.05
net_sameip_stale_timeout 3.0
sv_pmove_legacy_preserve_qc_velocity 1
max_edicts 15000

// Explicit vanilla/QSS-M movement baseline.
sv_gravity 800
sv_maxspeed 320
sv_accelerate 10
sv_friction 4
sv_stopspeed 100
edgefriction 2
sv_maxvelocity 2000

// Co-op behavior expected by the live server.
sv_coop_ammo_respawn 1
sv_coop_ammo_respawn_time 15
sv_coop_progression_item_respawn 1
sv_coop_progression_item_respawn_time 5
sv_coop_progression_item_respawn_classes "item_jboots item_jboots_timed item_artifact_envirosuit item_artifact_wetsuit item_artifact_airtank item_artifact_divingsuit"
sv_coop_respawn_near_player 1
sv_coop_respawn_delay 10
sv_coop_respawn_keep_weapons_ammo 1
sv_save_multiplayer 1
sv_coop_autosave 0
sv_triggerdebug 0
developer 0
