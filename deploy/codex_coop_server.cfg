// Shared co-op server defaults used by Codex deploy scripts.
deathmatch 0
coop 1
sv_cheats 1
sv_nofriendlyfire 1

// QSS-M-style dedicated cadence and latest-client networking.
sys_ticrate 0.05
sv_netsort 1
sv_maxpacketsize 1400
sv_replacement_maxpackets 8
sv_nqplayerphysics 1
sv_trustedmovement 0
sv_inputtimeout 0.5
net_lagdebug 0
net_lagdebug_threshold 0.25
net_lagdebug_frame_threshold 0.05
sv_pmove_legacy_preserve_qc_velocity 1

// Co-op behavior expected by the live server.
sv_coop_ammo_respawn 1
sv_coop_ammo_respawn_time 15
sv_coop_progression_item_respawn 1
sv_coop_respawn_near_player 1
sv_coop_respawn_delay 10
sv_coop_respawn_keep_weapons_ammo 1
sv_save_multiplayer 1
sv_coop_autosave 0
sv_triggerdebug 0
developer 0
