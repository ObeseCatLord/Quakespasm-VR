name: Quakespasm VR Windows MSVC Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            artifact-platform: x64
            output-dir: Windows/VisualStudio/Build-quakespasm-sdl2/x64/Release
          - platform: Win32
            artifact-platform: x86
            output-dir: Windows/VisualStudio/Build-quakespasm-sdl2/x86/Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        if: matrix.platform == 'x64'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          path: .vcpkg

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up libcurl with Windows Schannel and Opus
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed with exit code $LASTEXITCODE" }
          .\.vcpkg\vcpkg.exe install --triplet x64-windows-static-md `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$env:GITHUB_WORKSPACE\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE" }

      - name: Download pinned Steam Audio SDK
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE 'steam-audio-sdk'
          $archive = Join-Path $env:RUNNER_TEMP 'steamaudio_4.8.1.zip'
          Invoke-WebRequest 'https://github.com/ValveSoftware/steam-audio/releases/download/v4.8.1/steamaudio_4.8.1.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne '4a0aa5ec1176f38f0b0993a37c2259d9e86f27e22d5e24f83ec4c3cb9a1d5449') {
            throw 'Steam Audio SDK SHA-256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $sdk
          foreach ($file in @('include\phonon.h', 'lib\windows-x64\phonon.lib', 'lib\windows-x64\phonon.dll', 'THIRDPARTY.md')) {
            if (!(Test-Path (Join-Path $sdk "steamaudio\$file"))) { throw "Steam Audio SDK is missing $file" }
          }
          $license = Join-Path $sdk 'steamaudio-LICENSE.txt'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ValveSoftware/steam-audio/v4.8.1/LICENSE.md' -OutFile $license
          if ((Get-FileHash -Algorithm SHA256 $license).Hash.ToLowerInvariant() -ne 'cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30') {
            throw 'Steam Audio license SHA-256 mismatch'
          }

      - name: Build
        shell: pwsh
        run: |
          $options = @(
            '-property:Configuration=Release',
            '-property:Platform=${{ matrix.platform }}',
            '-maxcpucount',
            '-verbosity:minimal'
          )
          if ('${{ matrix.platform }}' -eq 'x64') {
            $options += @(
              "-property:CurlRoot=$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows-static-md",
              '-property:UseCurl=true',
              "-property:OpusRoot=$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows-static-md",
              '-property:UseVoice=true',
              "-property:SteamAudioRoot=$env:GITHUB_WORKSPACE\steam-audio-sdk\steamaudio",
              '-property:UseSteamAudio=true'
            )
          }
          msbuild Windows\VisualStudio\quakespasm.sln $options
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $out = '${{ matrix.output-dir }}'
          $exe = Join-Path $out 'quakespasm-openvr.exe'
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          foreach ($dll in @('SDL2.dll', 'openvr_api.dll')) {
            $path = Join-Path $out $dll
            if (!(Test-Path $path)) { throw "Missing $path" }
          }
          if ('${{ matrix.platform }}' -eq 'x64') {
            $phonon = Join-Path $out 'phonon.dll'
            if (!(Test-Path $phonon)) { throw "Missing $phonon" }
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
            if (!$text.Contains('Press F1 to refresh add-on catalogue')) {
              throw 'The x64 executable was built without add-on catalogue support'
            }
            if ($text.Contains('Catalogue downloads disabled in this build')) {
              throw 'The x64 executable contains the disabled catalogue path'
            }
            if (!$text.Contains('voice_list_devices') -or !$text.Contains('voice_transmit')) {
              throw 'The x64 executable was built without voice chat support'
            }
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $vs = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
              Sort-Object FullName | Select-Object -Last 1
            if (!$dumpbin) { throw 'Could not find dumpbin.exe' }
            $imports = & $dumpbin.FullName /imports $exe | Out-String
            if ($imports -notmatch '(?i)openvr_api\.dll' -or $imports -notmatch 'VR_InitInternal2') {
              throw 'The x64 executable does not import the OpenVR runtime entry point'
            }
            if ($imports -notmatch '(?i)phonon\.dll' -or $imports -notmatch 'iplContextCreate') {
              throw 'The x64 executable does not import the Steam Audio runtime entry point'
            }
          }
          Get-ChildItem $out | Sort-Object Name | Select-Object Name, Length

      - name: Stage runtime files
        shell: pwsh
        run: |
          $out = '${{ matrix.output-dir }}'
          $stage = Join-Path $env:RUNNER_TEMP 'quakespasm-openvr-windows-${{ matrix.artifact-platform }}'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $extensions = @('.exe', '.dll', '.bat', '.json', '.ps1', '.txt', '.html', '.pak')
          Get-ChildItem $out -File |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant() -and
              $_.Name -notlike '*.vcxproj.*'
            } |
            Copy-Item -Destination $stage
          Copy-Item Quake/quakespasm.pak $stage
          if (!(Test-Path (Join-Path $stage 'quakespasm-openvr.exe'))) { throw 'Staging omitted the executable' }
          if ('${{ matrix.platform }}' -eq 'x64') {
            $licenses = Join-Path $stage 'third-party-licenses'
            New-Item -ItemType Directory -Force $licenses | Out-Null
            foreach ($package in @('curl', 'zlib', 'opus')) {
              $copyright = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows-static-md\share\$package\copyright"
              if (!(Test-Path $copyright)) { throw "Missing vcpkg copyright file: $copyright" }
              Copy-Item $copyright (Join-Path $licenses "$package.txt")
            }
            Copy-Item "$env:GITHUB_WORKSPACE\steam-audio-sdk\steamaudio-LICENSE.txt" (Join-Path $licenses 'steamaudio-LICENSE.txt')
            Copy-Item "$env:GITHUB_WORKSPACE\steam-audio-sdk\steamaudio\THIRDPARTY.md" (Join-Path $licenses 'steamaudio-THIRDPARTY.txt')
          }
          Get-ChildItem $stage | Sort-Object Name | Select-Object Name, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: quakespasm-openvr-windows-${{ matrix.artifact-platform }}
          path: ${{ runner.temp }}/quakespasm-openvr-windows-${{ matrix.artifact-platform }}/**
