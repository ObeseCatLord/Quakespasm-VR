name: Build Distribution

on:
  push:
    branches: [ "linux-native-build" ]
  pull_request:
    branches: [ "linux-native-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          libsdl2-dev \
          libvorbis-dev \
          libmad0-dev \
          libflac-dev \
          libopus-dev \
          libopusfile-dev \
          libmikmod-dev \
          libxmp-dev \
          zip

    - name: Build Linux
      run: |
        make -C Quake -f Makefile.linux -j$(nproc)
        mkdir -p dist/Linux
        cp Quake/quakespasm-openvr dist/Linux/
        # Note: libopenvr_api.so will need to be provided or linked appropriately
        # For simplicity, we assume the user provides the Quake data files.

    - name: Build Windows
      run: |
        # Use SDL2 for Windows build to avoid linkage issues
        make -C Quake -f Makefile.w64 \
          CC=x86_64-w64-mingw32-gcc \
          CXX=x86_64-w64-mingw32-g++ \
          WINDRES=x86_64-w64-mingw32-windres \
          USE_SDL2=1 \
          -j$(nproc)
        mkdir -p dist/Windows
        cp Quake/quakespasm.exe dist/Windows/quakespasm-openvr.exe
        cp Windows/SDL2/lib64/SDL2.dll dist/Windows/
        cp Windows/OpenVR/bin/win64/openvr_api.dll dist/Windows/
        cp Windows/codecs/x64/*.dll dist/Windows/
        cp Windows/static-release-files/quakespasm.pak dist/Windows/

    - name: Add common assets
      run: |
        cp Quakespasm.html Quakespasm.txt Quakespasm-Music.txt LICENSE.txt history.txt dist/Windows/
        cp Quakespasm.html Quakespasm.txt Quakespasm-Music.txt LICENSE.txt history.txt dist/Linux/
        cp Quake/quakespasm.pak dist/Linux/

    - name: Upload Windows Build
      uses: actions/upload-artifact@v4
      with:
        name: quakespasm-openvr-windows
        path: dist/Windows/

    - name: Upload Linux Build
      uses: actions/upload-artifact@v4
      with:
        name: quakespasm-openvr-linux
        path: dist/Linux/
