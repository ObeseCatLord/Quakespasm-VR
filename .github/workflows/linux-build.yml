name: Quakespasm VR Linux CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    env:
      LINUX_GLIBC_MAX: '2.39'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            libcurl4-openssl-dev \
            libflac-dev \
            libgl1-mesa-dev \
            libmad0-dev \
            libogg-dev \
            libopenvr-dev \
            libopusfile-dev \
            libsdl2-dev \
            libvorbis-dev \
            libxmp-dev \
            pkg-config

      - name: Build
        run: |
          make -C Quake -f Makefile.linux clean
          make -C Quake -f Makefile.linux -j"$(nproc)"

      - name: Verify build outputs
        shell: bash
        run: |
          test -x Quake/quakespasm-openvr
          test -x Quake/quakespasm-openvr.bin
          ldd Quake/quakespasm-openvr.bin
          max_glibc="$(readelf --version-info --wide Quake/quakespasm-openvr.bin |
            grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' |
            sort -Vu | tail -n 1)"
          echo "quakespasm-openvr.bin maximum GLIBC requirement: ${max_glibc:-none}"
          if test -n "$max_glibc" &&
             test "$(printf '%s\n%s\n' "$max_glibc" "$LINUX_GLIBC_MAX" |
               sort -V | tail -n 1)" != "$LINUX_GLIBC_MAX"; then
            echo "Linux binary requires GLIBC_$max_glibc, newer than allowed GLIBC_$LINUX_GLIBC_MAX" >&2
            exit 1
          fi

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: quakespasm-openvr-linux
          path: |
            Quake/quakespasm-openvr
            Quake/quakespasm-openvr.bin
