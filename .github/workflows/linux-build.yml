name: Quakespasm VR Linux CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    env:
      LINUX_GLIBC_MAX: '2.39'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            file \
            libcurl4-openssl-dev \
            libflac-dev \
            libgl1-mesa-dev \
            libmad0-dev \
            libogg-dev \
            libopenvr-dev \
            libopusfile-dev \
            libsdl2-dev \
            libvorbis-dev \
            libxmp-dev \
            pkg-config

      - name: Prepare pinned Steam Audio SDK
        shell: bash
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/steamaudio.zip" https://github.com/ValveSoftware/steam-audio/releases/download/v4.8.1/steamaudio_4.8.1.zip
          echo "4a0aa5ec1176f38f0b0993a37c2259d9e86f27e22d5e24f83ec4c3cb9a1d5449  $RUNNER_TEMP/steamaudio.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/steamaudio.zip" -d "$RUNNER_TEMP"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/ValveSoftware/steam-audio/v4.8.1/LICENSE.md -o "$RUNNER_TEMP/steamaudio/steamaudio-LICENSE.txt"
          echo "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  $RUNNER_TEMP/steamaudio/steamaudio-LICENSE.txt" | sha256sum -c -
          cp "$RUNNER_TEMP/steamaudio/THIRDPARTY.md" "$RUNNER_TEMP/steamaudio/steamaudio-THIRDPARTY.txt"
          echo "$RUNNER_TEMP/steamaudio/lib/linux-x64" | sudo tee /etc/ld.so.conf.d/steamaudio.conf
          sudo ldconfig

      - name: Build
        run: |
          make -C Quake -f Makefile.linux clean
          make -C Quake -f Makefile.linux USE_STEAMAUDIO=1 STEAMAUDIO_SDK="$RUNNER_TEMP/steamaudio" -j"$(nproc)"

      - name: Verify build outputs
        shell: bash
        run: |
          test -x Quake/quakespasm-openvr
          test -x Quake/quakespasm-openvr.bin
          ldd Quake/quakespasm-openvr.bin
          max_glibc="$(readelf --version-info --wide Quake/quakespasm-openvr.bin |
            grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' |
            sort -Vu | tail -n 1)"
          echo "quakespasm-openvr.bin maximum GLIBC requirement: ${max_glibc:-none}"
          if test -n "$max_glibc" &&
             test "$(printf '%s\n%s\n' "$max_glibc" "$LINUX_GLIBC_MAX" |
               sort -V | tail -n 1)" != "$LINUX_GLIBC_MAX"; then
            echo "Linux binary requires GLIBC_$max_glibc, newer than allowed GLIBC_$LINUX_GLIBC_MAX" >&2
            exit 1
          fi

          openvr_needed="$(readelf -d Quake/quakespasm-openvr.bin | awk '/NEEDED.*libopenvr_api/ {gsub(/[\[\]]/, "", $5); print $5; exit}')"
          test -n "$openvr_needed"
          openvr_path="$(ldconfig -p | awk -v soname="$openvr_needed" '$1 == soname {print $NF; exit}')"
          if test -z "$openvr_path"; then
            openvr_path="$(dpkg -L libopenvr-dev | awk -v soname="$openvr_needed" '$0 ~ ("/" soname "$") {print; exit}')"
          fi
          test -n "$openvr_path"
          openvr_path="$(readlink -f "$openvr_path")"
          openvr_runtime="$(basename "$openvr_path")"
          readelf -Ws Quake/quakespasm-openvr.bin | grep -Eq 'UND.*VR_InitInternal2'
          readelf -Ws "$openvr_path" | grep -Eq 'VR_InitInternal2'

      - name: Stage Linux x86_64 VR runtime
        shell: bash
        run: |
          set -euo pipefail
          binary=Quake/quakespasm-openvr.bin
          openvr_needed="$(readelf -d "$binary" | awk '/NEEDED.*libopenvr_api/ {gsub(/[\[\]]/, "", $5); print $5; exit}')"
          openvr_path="$(ldconfig -p | awk -v soname="$openvr_needed" '$1 == soname {print $NF; exit}')"
          if test -z "$openvr_path"; then
            openvr_path="$(dpkg -L libopenvr-dev | awk -v soname="$openvr_needed" '$0 ~ ("/" soname "$") {print; exit}')"
          fi
          test -n "$openvr_path"
          openvr_path="$(readlink -f "$openvr_path")"
          openvr_runtime="$(basename "$openvr_path")"
          folder="$RUNNER_TEMP/quakespasm-openvr-linux-x86_64"
          install -d "$folder"
          install -m 0755 Quake/quakespasm-openvr "$binary" "$folder/"
          install -m 0644 Quake/quakespasm.pak LICENSE.txt "$folder/"
          install -m 0644 "$RUNNER_TEMP/steamaudio/lib/linux-x64/libphonon.so" "$RUNNER_TEMP/steamaudio/steamaudio-LICENSE.txt" "$RUNNER_TEMP/steamaudio/steamaudio-THIRDPARTY.txt" "$folder/"
          readelf -d "$binary" | grep -q 'Shared library: \[libphonon.so\]'
          max_glibc="$(readelf --version-info "$folder/libphonon.so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -n 1)"
          test "$(printf '%s\n%s\n' "$max_glibc" "$LINUX_GLIBC_MAX" | sort -V | tail -n 1)" = "$LINUX_GLIBC_MAX"
          for loader_name in libopenvr_api.so "$openvr_needed" "$openvr_runtime"; do
            install -m 0644 "$openvr_path" "$folder/$loader_name"
          done

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: quakespasm-openvr-linux-x86_64
          path: ${{ runner.temp }}/quakespasm-openvr-linux-x86_64

  build-linux-arm64:
    name: Build Linux ARM64 VR
    runs-on: ubuntu-24.04-arm
    env:
      LINUX_GLIBC_MAX: '2.39'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            build-essential \
            file \
            libcurl4-openssl-dev \
            libflac-dev \
            libgl1-mesa-dev \
            libmad0-dev \
            libogg-dev \
            libopenvr-dev \
            libopusfile-dev \
            libsdl2-dev \
            libvorbis-dev \
            libxmp-dev \
            pkg-config

      - name: Build ARM64 VR engine
        run: |
          make -C Quake -f Makefile.linux clean
          make -C Quake -f Makefile.linux FLAC_DYNAMIC=1 -j"$(nproc)"

      - name: Verify ARM64 VR build outputs
        shell: bash
        run: |
          set -euo pipefail
          binary=Quake/quakespasm-openvr.bin
          test -x Quake/quakespasm-openvr
          test -x "$binary"
          file "$binary" | grep -Eq 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          openvr_needed="$(readelf -d "$binary" | awk '/NEEDED.*libopenvr_api/ {gsub(/[\[\]]/, "", $5); print $5; exit}')"
          test -n "$openvr_needed"
          openvr_path="$(ldconfig -p | awk -v soname="$openvr_needed" '$1 == soname {print $NF; exit}')"
          if test -z "$openvr_path"; then
            openvr_path="$(dpkg -L libopenvr-dev | awk -v soname="$openvr_needed" '$0 ~ ("/" soname "$") {print; exit}')"
          fi
          test -n "$openvr_path"
          openvr_path="$(readlink -f "$openvr_path")"
          openvr_runtime="$(basename "$openvr_path")"
          file "$openvr_path" | grep -Eq 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          readelf -Ws "$binary" | grep -Eq 'UND.*VR_InitInternal2'
          readelf -Ws "$openvr_path" | grep -Eq 'VR_InitInternal2'
          readelf -d "$binary" | grep -Eq '\((RPATH|RUNPATH)\).*\$ORIGIN'
          for elf in "$binary" "$openvr_path"; do
            max_glibc="$(readelf --version-info --wide "$elf" |
              grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' |
              sort -Vu | tail -n 1)"
            echo "$(basename "$elf") maximum GLIBC requirement: ${max_glibc:-none}"
            if test -n "$max_glibc" &&
               test "$(printf '%s\n%s\n' "$max_glibc" "$LINUX_GLIBC_MAX" |
                 sort -V | tail -n 1)" != "$LINUX_GLIBC_MAX"; then
              echo "$(basename "$elf") requires GLIBC_$max_glibc, newer than allowed GLIBC_$LINUX_GLIBC_MAX" >&2
              exit 1
            fi
          done

      - name: Stage Linux ARM64 VR runtime
        shell: bash
        run: |
          set -euo pipefail
          binary=Quake/quakespasm-openvr.bin
          openvr_needed="$(readelf -d "$binary" | awk '/NEEDED.*libopenvr_api/ {gsub(/[\[\]]/, "", $5); print $5; exit}')"
          openvr_path="$(ldconfig -p | awk -v soname="$openvr_needed" '$1 == soname {print $NF; exit}')"
          if test -z "$openvr_path"; then
            openvr_path="$(dpkg -L libopenvr-dev | awk -v soname="$openvr_needed" '$0 ~ ("/" soname "$") {print; exit}')"
          fi
          test -n "$openvr_path"
          openvr_path="$(readlink -f "$openvr_path")"
          openvr_runtime="$(basename "$openvr_path")"
          folder="$RUNNER_TEMP/quakespasm-openvr-linux-arm64"
          install -d "$folder"
          install -m 0755 Quake/quakespasm-openvr "$binary" "$folder/"
          install -m 0644 Quake/quakespasm.pak LICENSE.txt "$folder/"
          for loader_name in libopenvr_api.so "$openvr_needed" "$openvr_runtime"; do
            install -m 0644 "$openvr_path" "$folder/$loader_name"
          done

      - name: Upload Linux ARM64 VR build
        uses: actions/upload-artifact@v4
        with:
          name: quakespasm-openvr-linux-arm64
          path: ${{ runner.temp }}/quakespasm-openvr-linux-arm64
