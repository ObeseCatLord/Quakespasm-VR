// Insert after signon using openxr-local-smoke.gdb, not startup +exec.
// Map-loading keepalive refreshes can drain startup commands before signon.
alias xr_smoke_wait5 "wait; wait; wait; wait; wait"
alias xr_smoke_wait25 "xr_smoke_wait5; xr_smoke_wait5; xr_smoke_wait5; xr_smoke_wait5; xr_smoke_wait5"
alias xr_smoke_wait75 "xr_smoke_wait25; xr_smoke_wait25; xr_smoke_wait25"
r_tasks 1
host_maxfps 72

echo XR_SMOKE_oit0_aa0
r_oit 0
vid_fsaa 0
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_oit0_aa4
r_oit 0
vid_fsaa 4
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_oit1_aa0
r_oit 1
vid_fsaa 0
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_oit1_aa4
r_oit 1
vid_fsaa 4
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_oit2_aa0
r_oit 2
vid_fsaa 0
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_oit2_aa4
r_oit 2
vid_fsaa 4
vid_palettize 1
r_indirect 1
xr_smoke_wait75
viewpos
r_indirect 0
xr_smoke_wait75
viewpos

echo XR_SMOKE_pause_resize
vid_palettize 0
r_indirect 1
pause
xr_smoke_wait25
xr_smoke_wait25
xr_smoke_wait5
xr_smoke_wait5
vid_width 800
vid_height 600
vid_restart
xr_smoke_wait75
xr_smoke_wait25
pause
xr_smoke_wait75
viewpos
echo XR_SMOKE_complete
quit
